# CORnet-RT (5 time steps): neural noise in V4, IT readout (Fig 1b-c, S7; Tables S1, S2).
model: cornet_rt
time_steps: 5
model_dir: cornet_rt5_c
damage_type: noise
damaged_area: V4
damage_paths: [module.V4.conv_input, module.V4.conv1]
include_bias: false
levels: [0, 31, 0.1]  # noise SD in multiples of each layer's weight SD, 0 to 3
simulations: 200
readout_path: module.IT.output
readout_name: IT
