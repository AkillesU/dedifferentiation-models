# CORnet-RT (5 time steps): peripheral V1 neuron deletion, retained fovea 0.5, IT readout (Fig S5).
model: cornet_rt
time_steps: 5
model_dir: cornet_rt5_all
damage_type: eccentricity_gradual
damaged_area: V1
include_bias: false
levels: [0, 21, 0.05]  # maximum neuron deletion probability (p_max), 0 to 1
simulations: 200
readout_path: module.IT.output
readout_name: IT
eccentricity:
  layer_path: module.V1.conv_input
  band: [0.5, 1.0]
  reverse: false
  per_channel: false  # one spatial mask shared by all channels, as in the original run
