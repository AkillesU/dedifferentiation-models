# CORnet-RT (5 time steps): connection severing in IT, IT readout (Fig 1b-d, S7; Tables S1, S2).
model: cornet_rt
time_steps: 5
model_dir: cornet_rt5_c
damage_type: connections
damaged_area: IT
damage_paths: [module.IT.conv_input, module.IT.conv1]
include_bias: false
levels: [0, 21, 0.05]  # fraction of connections severed, 0 to 1
simulations: 200
readout_path: module.IT.output
readout_name: IT
