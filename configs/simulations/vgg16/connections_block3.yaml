# VGG16: connection severing in block3, classifier_4 readout (Fig S1).
model: vgg16
model_dir: vgg16_c
damage_type: connections
damaged_area: block3
damage_paths: [features.10, features.12, features.14]
include_bias: false
levels: [0, 21, 0.05]  # fraction of connections severed, 0 to 1
simulations: 200
readout_path: classifier.4
readout_name: classifier_4
