# VGG16: neural noise in block4, classifier_4 readout (Fig S1).
model: vgg16
model_dir: vgg16_c
damage_type: noise
damaged_area: block4
damage_paths: [features.17, features.19, features.21]
include_bias: false
levels: [0, 31, 0.1]  # noise SD in multiples of each layer's weight SD, 0 to 3
simulations: 200
readout_path: classifier.4
readout_name: classifier_4
