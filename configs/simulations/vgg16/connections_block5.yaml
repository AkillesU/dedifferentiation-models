# VGG16: connection severing in block5, classifier_4 readout (Fig S1).
model: vgg16
model_dir: vgg16_c
damage_type: connections
damaged_area: block5
damage_paths: [features.24, features.26, features.28]
include_bias: false
levels: [0, 21, 0.05]  # fraction of connections severed, 0 to 1
simulations: 200
readout_path: classifier.4
readout_name: classifier_4
