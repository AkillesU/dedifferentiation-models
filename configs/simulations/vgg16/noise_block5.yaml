# VGG16: neural noise in block5, classifier_4 readout (Fig S1).
model: vgg16
model_dir: vgg16_c
damage_type: noise
damaged_area: block5
damage_paths: [features.24, features.26, features.28]
include_bias: false
levels: [0, 31, 0.1]  # noise SD in multiples of each layer's weight SD, 0 to 3
simulations: 200
readout_path: classifier.4
readout_name: classifier_4
