# CORnet-RT (4 time steps): neural noise in IT, IT readout (Fig S1).
model: cornet_rt
time_steps: 4
model_dir: cornet_rt4_c
damage_type: noise
damaged_area: IT
damage_paths: [module.IT.conv_input, module.IT.conv1]
include_bias: false
levels: [0, 31, 0.1]  # noise SD in multiples of each layer's weight SD, 0 to 3
simulations: 200
readout_path: module.IT.output
readout_name: IT
