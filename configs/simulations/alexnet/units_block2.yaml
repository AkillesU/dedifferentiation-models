# AlexNet: neuron deletion in block2, classifier_2 readout (Fig S1).
model: alexnet
model_dir: alexnet_c+b
damage_type: units
damaged_area: block2
damage_paths: [features.3]
include_bias: true
levels: [0, 21, 0.05]  # fraction of units (filters) deleted, 0 to 1
simulations: 200
readout_path: classifier.2
readout_name: classifier_2
