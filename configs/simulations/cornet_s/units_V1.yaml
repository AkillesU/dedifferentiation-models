# CORnet-S (block convolutions only; skip projections intact): neuron deletion in V1, IT readout (Fig S1).
model: cornet_s
model_dir: cornet_s4_c+b
damage_type: units
damaged_area: V1
damage_paths: [module.V1.conv1, module.V1.conv2]
include_bias: true
levels: [0, 21, 0.05]  # fraction of units (filters) deleted, 0 to 1
simulations: 200
readout_path: module.IT.output
readout_name: IT
