# CORnet-S (block convolutions only; skip projections intact): neural noise in V1, IT readout (Fig S1).
model: cornet_s
model_dir: cornet_s4_c
damage_type: noise
damaged_area: V1
damage_paths: [module.V1.conv1, module.V1.conv2]
include_bias: false
levels: [0, 31, 0.1]  # noise SD in multiples of each layer's weight SD, 0 to 3
simulations: 200
readout_path: module.IT.output
readout_name: IT
